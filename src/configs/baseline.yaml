defaults:
  - model: baseline
  - writer: wandb
  - metrics: example
  - tokenizer: bpe
  - datasets: text_files
  - dataloader: example
  - transforms: none
  - _self_
tokenizer:
  path: data/tokenizer/bpe_${tokenizer_fit.vocab_size}.json
tokenizer_fit: # used only if the tokenizer file does not exist
  vocab_size: 8000 # including special tokens
  min_count: null # null or drop chunks rarer than this before fit
  save_counts: True # keep chunk frequencies to continue fitting later
optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}
loss_function:
  _target_: src.loss.ExampleLoss
trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: 500
  device_tensors: ["input_ids", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: False # if True, will override the previous run with the same name
  monitor: "max test_MulticlassAccuracy" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 1
