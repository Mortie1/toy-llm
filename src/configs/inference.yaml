defaults:
  - model: baseline
  - metrics: example
  - tokenizer: bpe
  - datasets: text_files_eval # we do not want to run inference on training data
  - dataloader: example
  - transforms: none
  - _self_
inferencer:
  device_tensors: ["input_ids", "labels"] # which tensors should be on device (ex. GPU)
  device: auto # device name or "auto"
  save_path: "example" # any name here, can be a dataset name
  seed: 1
  from_pretrained: "saved/model_best.pth" # path to the pretrained model
